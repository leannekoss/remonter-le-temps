    - paragraph [ref=f1e32]: "L'IGN photographie la France par rotation : tous les départements ne sont pas survolés chaque année, le nombre de millésimes varie donc selon les endroits."
    - paragraph [ref=f1e33]: "Ce site ne stocke rien, n'a pas de serveur et ne charge aucun script tiers : tout le traitement se fait dans votre navigateur. Il interroge en revanche deux services publics directement depuis votre appareil, qui reçoivent donc vos requêtes : la Base Adresse Nationale reçoit l'adresse que vous tapez, ou votre position si vous l'autorisez, et l'IGN reçoit les coordonnées de la vue affichée. Ce qu'ils en conservent relève de leurs propres conditions."