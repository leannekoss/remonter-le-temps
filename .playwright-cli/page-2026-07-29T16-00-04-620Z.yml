      - link "Henri Casalis" [ref=f3e45] [cursor=pointer]:
        - /url: https://www.linkedin.com/in/henricasalis/
    - paragraph [ref=f3e46]: "Photographies aériennes, carte d'état-major et carte de Cassini : Institut national de l'information géographique et forestière (IGN), via data.geopf.fr, sous Licence Ouverte Etalab 2.0. Cassini numérisée avec les Archives nationales. Données mises à jour en 2026. Recherche d'adresse : Base Adresse Nationale."
    - paragraph [ref=f3e47]: "L'IGN photographie la France par rotation : tous les départements ne sont pas survolés chaque année, le nombre de millésimes varie donc selon les endroits."
    - paragraph [ref=f3e48]: "Ce site ne stocke rien, n'a pas de serveur et ne charge aucun script tiers : tout le traitement se fait dans votre navigateur. Il interroge en revanche deux services publics directement depuis votre appareil, qui reçoivent donc vos requêtes : la Base Adresse Nationale reçoit l'adresse que vous tapez, ou votre position si vous l'autorisez, et l'IGN reçoit les coordonnées de la vue affichée. Ce qu'ils en conservent relève de leurs propres conditions."